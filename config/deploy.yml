service: sparkui
image: limeade-labs/sparkui

servers:
  web:
    - 157.245.14.0

proxy:
  ssl: true
  host: sparkui.dev
  app_port: 3457
  healthcheck:
    path: /up
    interval: 5
    timeout: 5

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: root

builder:
  arch: amd64

env:
  clear:
    SPARKUI_PORT: 3457
    SPARKUI_BASE_URL: https://sparkui.dev
    OPENCLAW_HOOKS_URL: http://127.0.0.1:18789/hooks/agent
  secret:
    - PUSH_TOKEN
    - OPENCLAW_HOOKS_TOKEN
    - REDIS_URL

accessories:
  redis:
    image: redis:7-alpine
    host: 157.245.14.0
    # No `port:` on purpose. Publishing 6379 exposed Redis to the internet
    # (Docker bypasses ufw) and it was hijacked. The app reaches it over the
    # kamal network as sparkui-redis.
    volumes:
      - sparkui-redis-data-v2:/data
    env:
      secret:
        - REDIS_PASSWORD
    cmd: sh -c 'exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"'
